<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP is delivered as a response header from the main process
      (installContentSecurityPolicy in src/main/window.ts) instead of a static
      <meta> tag, so it can stay strict in production while permitting Vite's
      inline HMR preamble in dev. A single static policy blocked the dev preamble
      and left the window blank.
    -->
    <title>Myto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
