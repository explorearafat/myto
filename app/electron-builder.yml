appId: com.sylor.app
productName: Myto
copyright: Copyright © 2026 Myto
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  # Ship the brand PNG inside the package so the system-tray keep-alive (opt-in
  # background autonomy) has a runtime icon; buildResources otherwise keeps resources/
  # out of the app. asarUnpack below places it in app.asar.unpacked/resources/.
  - resources/icon.png
asarUnpack:
  - resources/**
  # node-pty (#2 interactive terminal) ships a native .node addon + a ConPTY helper
  # exe that cannot be require()'d from inside the asar archive — unpack it so the
  # packaged app loads it from app.asar.unpacked, the failure that only bites outside `dev`.
  - node_modules/@lydell/node-pty/**
  - node_modules/@lydell/node-pty-*/**
  # ffmpeg-static / ffprobe-static ship a platform binary that the video/photo editing
  # tools spawn (ffmpeg-runtime.ts). A binary cannot be executed from inside the asar
  # archive, and ffmpeg-static reports its in-asar path — the runtime rewrites
  # app.asar → app.asar.unpacked, which only works if the binary is actually unpacked here.
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
  - '**/*.node'
win:
  target:
    - nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  # Version-less, space-less name so the public download link is permanent across
  # releases: github.com/<repo>/releases/latest/download/Myto-Setup.exe
  artifactName: ${productName}-Setup.exe
