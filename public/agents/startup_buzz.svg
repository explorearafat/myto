<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f062a8"/>
      <stop offset="1" stop-color="#8e1d5c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="252" fill="none" stroke="url(#ring)" stroke-width="8"/>
  <g transform="rotate(45 256 256)">
    <!-- rocket body -->
    <path d="M256 92 C298 136 314 196 314 260 C314 300 306 330 296 352 L216 352 C206 330 198 300 198 260 C198 196 214 136 256 92 Z" fill="#ffffff"/>
    <!-- window -->
    <circle cx="256" cy="222" r="30" fill="#eb4899"/>
    <circle cx="256" cy="222" r="18" fill="#ffffff"/>
    <!-- fins -->
    <path d="M198 268 C164 288 150 322 148 356 L196 348 Z" fill="#ffffff" opacity="0.85"/>
    <path d="M314 268 C348 288 362 322 364 356 L316 348 Z" fill="#ffffff" opacity="0.85"/>
    <!-- exhaust flame -->
    <path d="M232 368 C244 392 244 412 256 432 C268 412 268 392 280 368 Z" fill="#ffd95c"/>
  </g>
  <!-- motion sparks -->
  <circle cx="128" cy="132" r="10" fill="#ffffff" opacity="0.55"/>
  <circle cx="392" cy="112" r="7" fill="#ffffff" opacity="0.45"/>
  <circle cx="404" cy="380" r="8" fill="#ffffff" opacity="0.35"/>
</svg>
