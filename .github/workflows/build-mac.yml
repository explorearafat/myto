name: Build macOS App

# Publish Myto-x64.dmg + Myto-arm64.dmg (and matching .zip) whenever you push a
# version tag (e.g. v0.7.1), or run it manually from the Actions tab — the macOS
# mirror of build-windows.yml. The download page links to
# /releases/latest/download/Myto-arm64.dmg and .../Myto-x64.dmg.
#
# Built PER ARCHITECTURE on separate runners, never as one universal binary:
# ffmpeg-static and @lydell/node-pty each resolve a *host-arch* native binary at
# `npm ci` time (see app/electron-builder.yml), so the Intel runner (macos-13)
# produces x64 and the Apple-silicon runner (macos-14) produces arm64. The app is
# ad-hoc signed by scripts/macos-finalize.mjs (no Developer ID certificate), so
# Gatekeeper warns on first open — the macOS counterpart to the SmartScreen
# warning the self-signed Windows installer already shows.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-13
            script: dist:mac:x64
          - arch: arm64
            runner: macos-14
            script: dist:mac:arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app (${{ matrix.arch }})
        run: npm run ${{ matrix.script }}

      - name: Publish ${{ matrix.arch }} dmg + zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/release/Myto-${{ matrix.arch }}.dmg
            app/release/Myto-${{ matrix.arch }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
