name: Build Windows App

# Publish a new Myto-Setup.exe whenever you push a version tag (e.g. v0.1.1),
# or run it manually from the Actions tab. The landing page links to
# /releases/latest/download/Myto-Setup.exe, so a new release auto-updates the
# download button on mytocode.vercel.app.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/release/Myto-Setup.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
