name: Build Android App

# Publish a native Myto APK whenever you push a version tag (e.g. v0.1.6), or run
# it manually from the Actions tab. The download page links to
# /releases/latest/download/myto.apk, so a new release auto-updates the Android
# button on mytocode.vercel.app — the mobile mirror of build-windows.yml.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the android/ platform folder
        # mobile/ commits only lib/ + config; the platform folders are gitignored and
        # regenerated here. `flutter create` overwrites our tracked files (main.dart,
        # pubspec, analysis_options, .gitignore, README, test), so restore them right
        # after — the freshly generated, untracked android/ survives the checkout.
        run: |
          flutter create --platforms=android --org com.sylor --project-name sylor .
          git checkout -- .

      - name: Raise Android minSdk for Firebase (best-effort)
        # firebase_auth needs minSdk >= 23; Flutter still defaults lower. This patches
        # whichever Gradle DSL `flutter create` emitted, and is a harmless no-op if the
        # token is already gone or renamed.
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

      - name: Register the myto:// sign-in deep link
        # flutter_web_auth_2 captures the OAuth callback (myto://auth-callback) through a
        # CallbackActivity that must be declared in the manifest. android/ is regenerated by
        # `flutter create` above, so inject it here. Idempotent (grep-guarded); keep the
        # android:scheme in sync with _callbackScheme in lib/services/auth_service.dart.
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if grep -q "flutter_web_auth_2.CallbackActivity" "$MANIFEST"; then
            echo "CallbackActivity already present; skipping"
          else
            perl -0pi -e 's{</application>}{        <activity android:name="com.linusu.flutter_web_auth_2.CallbackActivity" android:exported="true" android:taskAffinity=""><intent-filter android:label="flutter_web_auth_2"><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="myto" /></intent-filter></activity>\n    </application>}' "$MANIFEST"
            echo "Injected myto:// CallbackActivity into $MANIFEST"
          fi

      - name: Set the visible app name to "Myto"
        # `flutter create --project-name sylor` stamps android:label="sylor" on <application>,
        # which is the name users see under the launcher icon. The project name must stay "sylor"
        # (every `package:sylor/...` import + widget_test.dart depend on it), so we only rewrite
        # the human-facing label here. Targets the exact "sylor" value, so the CallbackActivity's
        # android:label="flutter_web_auth_2" is untouched. No-op if the token is already gone.
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's/android:label="sylor"/android:label="Myto"/g' "$MANIFEST"
          echo "Set android:label to Myto in $MANIFEST"

      - name: Enable voice input permissions
        # The composer's mic uses speech_to_text (Android SpeechRecognizer). That needs the
        # RECORD_AUDIO permission and, on Android 11+, a <queries> entry so the app can resolve
        # the system RecognitionService under package-visibility rules. android/ is regenerated by
        # `flutter create`, so inject both here. Idempotent (grep-guarded). If the permission is
        # missing at runtime the app degrades gracefully to a snackbar rather than crashing.
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            echo "RECORD_AUDIO already present; skipping"
          else
            perl -0pi -e 's{(<manifest[^>]*>)}{$1\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>}' "$MANIFEST"
            echo "Injected RECORD_AUDIO + RecognitionService <queries> into $MANIFEST"
          fi

      - name: Voice-call permissions (Myto Remote)
        # The Call tab's WebRTC audio needs MODIFY_AUDIO_SETTINGS (speaker routing)
        # and BLUETOOTH_CONNECT (headset routing on Android 12+). WAKE_LOCK keeps the
        # screen awake on an incoming callback, and USE_FULL_SCREEN_INTENT lets the
        # `calls` notification channel ring full-screen like a real call. android/ is
        # regenerated above; inject idempotently (grep-guarded).
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for PERM in android.permission.MODIFY_AUDIO_SETTINGS android.permission.BLUETOOTH_CONNECT android.permission.WAKE_LOCK android.permission.USE_FULL_SCREEN_INTENT; do
            if grep -q "$PERM" "$MANIFEST"; then
              echo "$PERM already present; skipping"
            else
              perl -0pi -e "s{(<manifest[^>]*>)}{\$1\n    <uses-permission android:name=\"$PERM\" />}" "$MANIFEST"
              echo "Injected $PERM into $MANIFEST"
            fi
          done

      - name: Firebase push (google-services.json + gradle + manifest)
        # android/ is regenerated by flutter create above, so the FCM wiring is
        # injected here, idempotently: the google-services.json template (public
        # identifiers only), the google-services gradle plugin, the
        # POST_NOTIFICATIONS permission and FCM's default channel.
        run: |
          cp config/google-services.json android/app/google-services.json
          if ! grep -q "com.google.gms.google-services" android/settings.gradle.kts; then
            perl -0pi -e 's|id("com.android.application")|id("com.google.gms.google-services") version "4.4.2" apply false\n    id("com.android.application")|' android/settings.gradle.kts
          fi
          if ! grep -q 'id("com.google.gms.google-services")' android/app/build.gradle.kts; then
            perl -0pi -e 's|id("dev.flutter.flutter-gradle-plugin")|id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")|' android/app/build.gradle.kts
          fi
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            perl -0pi -e 's{(<manifest[^>]*>)}{$1\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />}' "$MANIFEST"
          fi
          if ! grep -q "default_notification_channel_id" "$MANIFEST"; then
            perl -0pi -e 's{</application>}{        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="messages" />\n    </application>}' "$MANIFEST"
          fi
          echo "Firebase push wiring injected"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate the launcher icon
        # Stamp the Myto star over the default Flutter icon that `flutter create` emitted, into the
        # freshly generated android/. Reads the flutter_launcher_icons config + assets/icon/*.png
        # (both tracked in mobile/). Harmless to re-run; overwrites the mipmaps in place.
        run: dart run flutter_launcher_icons

      - name: Build release APK
        # No release keystore yet, so this is debug-signed (installs via "unknown
        # sources") — the Android counterpart to the self-signed Windows installer.
        run: flutter build apk --release

      - name: Stage the APK under a stable name
        run: cp build/app/outputs/flutter-apk/app-release.apk myto.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/myto.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
