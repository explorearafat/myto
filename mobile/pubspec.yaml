name: sylor
description: "Myto — a local-first AI coding workspace. The mobile chat companion."
publish_to: "none"
version: 0.8.0+11

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking — streams the SSE reply from the Oraculum gateway.
  http: ^1.2.2

  # State + local persistence.
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Assistant messages are Markdown (code blocks, lists, …), like Claude.
  flutter_markdown: ^0.7.4

  # Sign-in against the same Firebase project as the website. Google blocks OAuth inside app
  # webviews, so we don't sign in on-device: flutter_web_auth_2 opens a real browser (Custom
  # Tab) at mytocode.vercel.app/authentication, which runs Google sign-in and relays the OIDC
  # ID token back to myto://auth-callback; we finish with signInWithCredential. No native
  # google_sign_in plugin, google-services.json, SHA-1, or release keystore is required.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  flutter_web_auth_2: ^5.1.0

  # Bring-your-own-key config synced from the user's account (users/{uid}/config/byok).
  cloud_firestore: ^5.4.3

  # On-device voice input for the composer's mic button. Uses the platform speech recognizer
  # (Android SpeechRecognizer); degrades gracefully to a snackbar when unavailable or denied.
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates the Android launcher icon (mipmaps + adaptive icon) from the PNGs below.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App launcher icon — the monochrome Myto mitochondria mark (near-white #F0F0EC) on charcoal
# #181818. Regenerate the source PNGs with `python scripts/build-launcher-icon.py`; CI then runs
# `dart run flutter_launcher_icons` after `flutter create` to stamp them over the default Flutter
# icon.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/myto_icon.png"
  adaptive_icon_background: "#181818"
  adaptive_icon_foreground: "assets/icon/myto_icon_foreground.png"
  min_sdk_android: 23
