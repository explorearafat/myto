name: sylor
description: "Sylor — a local-first AI coding workspace. The mobile chat companion."
publish_to: "none"
version: 0.2.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking — streams the SSE reply from the Oraculum gateway.
  http: ^1.2.2

  # State + local persistence.
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Assistant messages are Markdown (code blocks, lists, …), like Claude.
  flutter_markdown: ^0.7.4

  # Sign-in against the same Firebase project as the website. Google blocks OAuth inside app
  # webviews, so we don't sign in on-device: flutter_web_auth_2 opens a real browser (Custom
  # Tab) at sylorcode.vercel.app/authentication, which runs Google sign-in and relays the OIDC
  # ID token back to sylor://auth-callback; we finish with signInWithCredential. No native
  # google_sign_in plugin, google-services.json, SHA-1, or release keystore is required.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  flutter_web_auth_2: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates the Android launcher icon (mipmaps + adaptive icon) from the PNGs below.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App launcher icon — the universal Sylor star (#cf5535) on warm paper. Regenerate the source
# PNGs with `python scripts/build-launcher-icon.py`; CI then runs `dart run flutter_launcher_icons`
# after `flutter create` to stamp them over the default Flutter icon.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/sylor_icon.png"
  adaptive_icon_background: "#FAF9F5"
  adaptive_icon_foreground: "assets/icon/sylor_icon_foreground.png"
  min_sdk_android: 23
