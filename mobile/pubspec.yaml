name: sylor
description: "Myto — a local-first AI coding workspace. The mobile chat companion."
publish_to: "none"
version: 0.18.6+35

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking — streams the SSE reply from the Oraculum gateway.
  http: ^1.2.2

  # State + local persistence.
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Assistant messages are Markdown (code blocks, lists, …), like Claude.
  flutter_markdown: ^0.7.4

  # Agent profile pictures. The hand-drawn avatar library ships as inline SVG
  # strings (widgets/agent_art_data.dart), so it renders crisp at any size with
  # no raster assets to bundle.
  flutter_svg: ^2.0.10+1

  # Sign-in against the same Firebase project as the website. Google blocks OAuth inside app
  # webviews, so we don't sign in on-device: flutter_web_auth_2 opens a real browser (Custom
  # Tab) at mytocode.vercel.app/authentication, which runs Google sign-in and relays the OIDC
  # ID token back to myto://auth-callback; we finish with signInWithCredential. No native
  # google_sign_in plugin, google-services.json, SHA-1, or release keystore is required.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  flutter_web_auth_2: ^5.1.0

  # Bring-your-own-key config synced from the user's account (users/{uid}/config/byok).
  cloud_firestore: ^5.4.3

  # On-device voice input for the composer's mic button. Uses the platform speech recognizer
  # (Android SpeechRecognizer); degrades gracefully to a snackbar when unavailable or denied.
  speech_to_text: ^7.0.0

  # Group-chat photo upload: pick from gallery, copy into app documents storage.
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Real push notifications (FCM): system-tray pushes when the app is
  # closed/backgrounded, exactly like WhatsApp/Facebook.
  firebase_messaging: ^15.1.6

  # Myto Remote voice calls: WebRTC audio + data channel to the desktop agent.
  flutter_webrtc: ^0.12.4

  # Scan-to-pair: the desktop shows a QR encoding myto://call — app_links
  # receives that deep link (cold start + foreground) so the first call starts
  # the moment the QR is scanned.
  app_links: ^6.1.0

  # Call sounds: looping ringtone + vibration for incoming callbacks, ringback
  # while dialing, and a connect chime when the call goes live.
  audioplayers: ^6.1.0
  vibration: ^3.1.1

  # Incoming-call presentation: a full-screen-intent notification channel that
  # wakes the screen and deep-links into the incoming-call screen, WhatsApp-style.
  flutter_local_notifications: ^18.0.1

  # Fallback voice when the desktop's Edge TTS is unavailable: Myto speaks the
  # same sentences with the phone's own TTS engine.
  flutter_tts: ^4.2.0

  # Opens the profile social links (instagram.com / wa.me / tiktok.com).
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates the Android launcher icon (mipmaps + adaptive icon) from the PNGs below.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # The ten chat agents' mascot portraits + the call sound set (bundled).
  assets:
    - assets/agents/chat/
    - assets/audio/

  # The cursive wordmark ("Myto" on the Discover header) — Dancing Script (OFL).
  fonts:
    - family: Dancing Script
      fonts:
        - asset: assets/fonts/DancingScript.ttf
          weight: 700

# App launcher icon — the monochrome Myto mitochondria mark (near-white #F0F0EC) on charcoal
# #181818. Regenerate the source PNGs with `python scripts/build-launcher-icon.py`; CI then runs
# `dart run flutter_launcher_icons` after `flutter create` to stamp them over the default Flutter
# icon.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/myto_icon.png"
  adaptive_icon_background: "#181818"
  adaptive_icon_foreground: "assets/icon/myto_icon_foreground.png"
  min_sdk_android: 23
